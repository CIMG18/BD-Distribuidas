# Nodos (sucursales) del sistema distribuido.
# Levantar Morelia y Pátzcuaro:   docker compose up -d
# Levantar además Uruapan (extra): docker compose --profile extra up -d
# Borrar todo y empezar de cero:   docker compose --profile extra down -v

services:
  morelia:
    image: mariadb:11
    container_name: nodo_morelia
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configura DB_ROOT_PASSWORD}
      MARIADB_DATABASE: sucursal
    ports:
      - "3307:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/morelia.sql:/docker-entrypoint-initdb.d/02-datos.sql:ro
      - morelia_data:/var/lib/mysql

  patzcuaro:
    image: mariadb:11
    container_name: nodo_patzcuaro
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configura DB_ROOT_PASSWORD}
      MARIADB_DATABASE: sucursal
    ports:
      - "3308:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/patzcuaro.sql:/docker-entrypoint-initdb.d/02-datos.sql:ro
      - patzcuaro_data:/var/lib/mysql

  # Nodo extra para probar la función "agregar nodo"
  uruapan:
    profiles: ["extra"]
    image: mariadb:11
    container_name: nodo_uruapan
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: sucursal
    ports:
      - "3309:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - uruapan_data:/var/lib/mysql

volumes:
  morelia_data:
  patzcuaro_data:
  uruapan_data: